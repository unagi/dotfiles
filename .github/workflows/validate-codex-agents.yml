name: Validate Codex agent TOML

on:
  pull_request:
    paths:
      - 'dot_codex/**'
      - '.chezmoitemplates/**'
      - '.chezmoidata*'
      - '.chezmoidata/**'
      - '.github/workflows/validate-codex-agents.yml'
  push:
    paths:
      - 'dot_codex/**'
      - '.chezmoitemplates/**'
      - '.chezmoidata*'
      - '.chezmoidata/**'
      - '.github/workflows/validate-codex-agents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate team policy in source
        shell: python
        run: |
          import pathlib
          import re
          import tomllib

          source = pathlib.Path.cwd()
          expected = {
              'parent-sol': ('sol', 'medium', 'parent', 'workspace-write'),
              'parent-astra': ('astra', 'low', 'parent', 'workspace-write'),
              'worker-luna-low': ('luna', 'low', 'worker', 'workspace-write'),
              'worker-luna-high': ('luna', 'high', 'worker', 'workspace-write'),
              'worker-sol-low': ('sol', 'low', 'worker', 'workspace-write'),
              'worker-sol-high': ('sol', 'high', 'worker', 'workspace-write'),
              'advisor-sol': ('sol', 'xhigh', 'advisor', 'read-only'),
              'advisor-astra': ('astra', 'medium', 'advisor', 'read-only'),
              'reviewer-sol': ('sol', 'xhigh', 'reviewer', 'read-only'),
              'reviewer-astra': ('astra', 'medium', 'reviewer', 'read-only'),
              'assistant-luna': ('luna', 'high', 'assistant', 'read-only'),
          }
          found = set()
          include = re.compile(r'{{\s*include "([^"]+)"\s*}}')
          for path in sorted((source / 'dot_codex/agents').glob('*.toml.tmpl')):
              agent = tomllib.loads(path.read_text())
              name = agent['name']
              assert name not in found, path
              found.add(name)
              model, effort, kind, sandbox = expected[name]
              assert path.name == name + '.toml.tmpl', path
              assert agent['model'] == 'gpt-6-' + model, path
              assert agent['model_reasoning_effort'] == effort, path
              assert agent['sandbox_mode'] == sandbox, path
              instructions = agent['developer_instructions']
              actual = {pathlib.Path(ref).stem for ref in include.findall(instructions)}
              required = {'hypothesis'}
              if kind != 'assistant':
                  required.add(kind)
              if kind != 'parent':
                  required.add('child')
              assert actual == required, (path, actual)
          assert found == set(expected), found
          for folder in ('dot_codex', '.chezmoitemplates/agent/codex'):
              for path in (source / folder).rglob('*'):
                  if not path.is_file():
                      continue
                  body = path.read_text()
                  for ref in include.findall(body):
                      assert (source / ref).is_file(), (path, ref)
                  assert 'change-review.md' not in body, path
                  assert 'parent-advanced.md' not in body, path
                  if path.suffix == '.md':
                      assert not include.search(body), path
          print('Validated 11 roles, model/effort, sandbox, role isolation and includes')
      - name: Install chezmoi
        env:
          CHEZMOI_VERSION: '2.70.3'
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/chezmoi.tar.gz"
          mkdir -p "$RUNNER_TEMP/chezmoi-bin"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/chezmoi-bin" chezmoi
          echo "$RUNNER_TEMP/chezmoi-bin" >> "$GITHUB_PATH"
      - name: Render templates and validate TOML
        shell: python
        run: |
          import pathlib
          import subprocess
          import tomllib

          source = pathlib.Path.cwd()
          templates = sorted((source / 'dot_codex/agents').glob('*.toml.tmpl'))
          if not templates:
              raise SystemExit('No Codex agent templates found')

          for template in templates:
              print(f'Validating {template.relative_to(source)}', flush=True)
              rendered = subprocess.run(
                  ['chezmoi', 'execute-template', '--source', str(source),
                   '--file', str(template)],
                  check=True, capture_output=True, text=True, encoding='utf-8',
              )
              tomllib.loads(rendered.stdout)
          print(f'Validated {len(templates)} Codex agent definitions')
