name: Validate agent templates

on:
  pull_request:
    paths:
      - 'dot_codex/**'
      - 'private_dot_claude/**'
      - '.chezmoitemplates/**'
      - '.chezmoidata*'
      - '.chezmoidata/**'
      - '.github/workflows/validate-codex-agents.yml'
      - 'scripts/**'
      - 'docs/instruction-reading-*.json'
      - 'docs/instruction-maintenance.md'
      - '.chezmoiignore'
  push:
    paths:
      - 'dot_codex/**'
      - 'private_dot_claude/**'
      - '.chezmoitemplates/**'
      - '.chezmoidata*'
      - '.chezmoidata/**'
      - '.github/workflows/validate-codex-agents.yml'
      - 'scripts/**'
      - 'docs/instruction-reading-*.json'
      - 'docs/instruction-maintenance.md'
      - '.chezmoiignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test instruction measurement
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Report instruction reading size
        run: |
          python3 scripts/measure-instructions.py > "$RUNNER_TEMP/instruction-reading.md"
          cat "$RUNNER_TEMP/instruction-reading.md" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/measure-instructions.py --format json > "$RUNNER_TEMP/instruction-reading.json"
      - name: Upload instruction reading report
        uses: actions/upload-artifact@v4
        with:
          name: instruction-reading
          path: |
            ${{ runner.temp }}/instruction-reading.md
            ${{ runner.temp }}/instruction-reading.json
      - name: Validate team policy in source
        shell: python
        run: |
          import pathlib
          import re
          import tomllib

          source = pathlib.Path.cwd()
          models = {
              'sol': 'gpt-6.2-sol',
              'astra': 'gpt-6.2-astra',
              'luna': 'gpt-6-luna',
              'terra': 'gpt-6.1-terra',
          }
          expected = {
              'parent-sol': ('sol', 'medium', 'parent', 'workspace-write'),
              'parent-sol-high': ('sol', 'high', 'parent', 'workspace-write'),
              'parent-sol-xhigh': ('sol', 'xhigh', 'parent', 'workspace-write'),
              'parent-astra': ('astra', 'low', 'parent', 'workspace-write'),
              'worker-luna-low': ('luna', 'low', 'worker', 'workspace-write'),
              'worker-luna-high': ('luna', 'high', 'worker', 'workspace-write'),
              'worker-sol-low': ('sol', 'low', 'worker', 'workspace-write'),
              'worker-sol-high': ('sol', 'high', 'worker', 'workspace-write'),
              'worker-terra': ('terra', 'medium', 'worker', 'workspace-write'),
              'advisor-sol': ('sol', 'xhigh', 'advisor', 'read-only'),
              'advisor-astra': ('astra', 'medium', 'advisor', 'read-only'),
              'reviewer-sol': ('sol', 'xhigh', 'reviewer', 'read-only'),
              'reviewer-astra': ('astra', 'medium', 'reviewer', 'read-only'),
              'assistant-luna': ('luna', 'high', 'assistant', 'read-only'),
              'assistant-terra': ('terra', 'medium', 'assistant', 'read-only'),
          }
          found = set()
          include = re.compile(r'{{\s*include "([^"]+)"\s*}}')
          for path in sorted((source / 'dot_codex/agents').glob('*.toml.tmpl')):
              agent = tomllib.loads(path.read_text())
              name = agent['name']
              assert name not in found, path
              found.add(name)
              family, effort, kind, sandbox = expected[name]
              assert path.name == name + '.toml.tmpl', path
              assert agent['model'] == models[family], path
              assert agent['model_reasoning_effort'] == effort, path
              assert agent['sandbox_mode'] == sandbox, path
              instructions = agent['developer_instructions']
              actual = set(include.findall(instructions))
              required = {
                  '.chezmoitemplates/agent/rules/core.md',
                  '.chezmoitemplates/agent/team/interface.md',
              }
              if kind == 'parent':
                  required.add('.chezmoitemplates/agent/team/planning.md')
              else:
                  required.add('.chezmoitemplates/agent/team/child.md')
                  if kind != 'assistant':
                      required.add('.chezmoitemplates/agent/team/' + kind + '.md')
              assert actual == required, (path, actual)
          assert found == set(expected), found
          claude_expected = {'assistant', 'worker', 'advisor', 'reviewer'}
          claude_paths = sorted((source / 'private_dot_claude/agents').glob('*.md.tmpl'))
          claude_found = {path.name.removesuffix('.md.tmpl') for path in claude_paths}
          assert claude_found == claude_expected, claude_found
          for path in claude_paths:
              kind = path.name.removesuffix('.md.tmpl')
              actual = set(include.findall(path.read_text()))
              required = {
                  '.chezmoitemplates/agent/rules/core.md',
                  '.chezmoitemplates/agent/team/interface.md',
                  '.chezmoitemplates/agent/team/child.md',
              }
              if kind != 'assistant':
                  required.add('.chezmoitemplates/agent/team/' + kind + '.md')
              assert actual == required, (path, actual)
          for product in ('dot_codex', 'private_dot_claude'):
              design = source / product / 'common/design.md.tmpl'
              assert include.findall(design.read_text()) == ['.chezmoitemplates/agent/engineering/design.md'], design
              team_entries = ('root', 'root-delegate', 'root-parent', 'recovery', 'planning', 'interface')
              engineering_entries = ('change-control', 'code-change', 'document-config')
              entries = [(name, 'team') for name in team_entries]
              entries += [(name, 'engineering') for name in engineering_entries]
              for name, area in entries:
                  path = source / product / 'common' / (name + '.md.tmpl')
                  assert include.findall(path.read_text()) == [f'.chezmoitemplates/agent/{area}/{name}.md'], path
          assert not (source / '.chezmoitemplates/agent/engineering/work-scope.md').exists()
          assert not (source / 'dot_codex/common/market-data-sources.md.tmpl').exists()
          for folder in ('dot_codex', 'private_dot_claude', '.chezmoitemplates/agent'):
              for path in (source / folder).rglob('*'):
                  if not path.is_file():
                      continue
                  body = path.read_text()
                  for ref in include.findall(body):
                      assert (source / ref).is_file(), (path, ref)
                  assert 'change-review.md' not in body, path
                  assert 'parent-advanced.md' not in body, path
                  if path.suffix == '.md':
                      assert not include.search(body), path
          assert not (source / 'dot_codex/common/root-agent.md.tmpl').exists()
          assert not (source / 'dot_codex/common/sub-agent.md.tmpl').exists()
          assert (source / 'dot_codex/common/team.md.tmpl').is_file()
          assert (source / 'private_dot_claude/common/team.md.tmpl').is_file()
          print(f'Validated {len(found)} Codex roles, 4 Claude roles, model/effort, sandbox and includes')
      - name: Install chezmoi
        env:
          CHEZMOI_VERSION: '2.70.3'
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/chezmoi.tar.gz"
          mkdir -p "$RUNNER_TEMP/chezmoi-bin"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/chezmoi-bin" chezmoi
          echo "$RUNNER_TEMP/chezmoi-bin" >> "$GITHUB_PATH"
      - name: Render templates and validate TOML
        shell: python
        run: |
          import pathlib
          import subprocess
          import tomllib

          source = pathlib.Path.cwd()
          templates = sorted((source / 'dot_codex/agents').glob('*.toml.tmpl'))
          if not templates:
              raise SystemExit('No Codex agent templates found')

          for template in templates:
              print(f'Validating {template.relative_to(source)}', flush=True)
              rendered = subprocess.run(
                  ['chezmoi', 'execute-template', '--source', str(source),
                   '--file', str(template)],
                  check=True, capture_output=True, text=True, encoding='utf-8',
              )
              tomllib.loads(rendered.stdout)
          print(f'Validated {len(templates)} Codex agent definitions')
