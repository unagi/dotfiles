name: Validate Codex agent TOML

on:
  pull_request:
    paths:
      - 'dot_codex/**'
      - '.chezmoitemplates/**'
      - '.chezmoidata*'
      - '.chezmoidata/**'
      - '.github/workflows/validate-codex-agents.yml'
  push:
    paths:
      - 'dot_codex/**'
      - '.chezmoitemplates/**'
      - '.chezmoidata*'
      - '.chezmoidata/**'
      - '.github/workflows/validate-codex-agents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate parent policy in source
        shell: python
        run: |
          import pathlib
          import re
          import tomllib

          source = pathlib.Path.cwd()
          expected = {
              'architect', 'finance-lead', 'implementation-lead-H',
              'implementation-lead-complex', 'research-lead-H',
              'research-lead-complex', 'advanced-research-lead',
              'recovery-lead', 'review-lead-astra',
          }
          parents = set()
          for path in (source / 'dot_codex/agents').glob('*.toml.tmpl'):
              agent = tomllib.loads(path.read_text())
              instructions = agent['developer_instructions']
              if 'parent.md' in instructions or agent['name'] in expected:
                  parents.add(agent['name'])
                  assert agent['model'] in {'gpt-6-sol', 'gpt-6-astra'}, path
                  assert 'parent.md' in instructions, path
                  assert 'parent-advanced.md' in instructions, path
              assert agent['name'] != 'research-lead', path
          assert parents == expected, parents
          assert not (source / '.chezmoitemplates/agent/codex/parent-survey.md').exists()
          for folder in ('dot_codex', '.chezmoitemplates/agent/codex'):
              for path in (source / folder).rglob('*'):
                  if path.is_file():
                      body = path.read_text()
                      assert 'parent-survey.md' not in body, path
                      assert not re.search(r'^\|.*`research-lead`', body, re.M), path
          print('Parent policy validated: 9 Sol/Astra roles')
      - name: Install chezmoi
        env:
          CHEZMOI_VERSION: '2.70.3'
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/chezmoi.tar.gz"
          mkdir -p "$RUNNER_TEMP/chezmoi-bin"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/chezmoi-bin" chezmoi
          echo "$RUNNER_TEMP/chezmoi-bin" >> "$GITHUB_PATH"
      - name: Render templates and validate TOML
        shell: python
        run: |
          import pathlib
          import subprocess
          import tomllib

          source = pathlib.Path.cwd()
          templates = sorted((source / 'dot_codex/agents').glob('*.toml.tmpl'))
          if not templates:
              raise SystemExit('No Codex agent templates found')

          for template in templates:
              print(f'Validating {template.relative_to(source)}', flush=True)
              rendered = subprocess.run(
                  ['chezmoi', 'execute-template', '--source', str(source),
                   '--file', str(template)],
                  check=True, capture_output=True, text=True, encoding='utf-8',
              )
              tomllib.loads(rendered.stdout)
          print(f'Validated {len(templates)} Codex agent definitions')
